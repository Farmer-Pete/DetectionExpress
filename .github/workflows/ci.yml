name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify the static build carries no dev-kit code
        run: pnpm run verify:static

      - name: Build the dev kit
        run: pnpm run build:devkit

      - name: Verify the profiler worker is bundled and wired
        run: pnpm run verify:worker-build

      - name: Verify the dev-kit tarball is complete
        run: pnpm run pack:check

      - name: Dead code check
        run: pnpm run knip

  # Second supply-chain layer. The pnpm-workspace.yaml cooldown keeps fresh releases out;
  # this catches versions with a known advisory (high or critical) that are already in the lockfile.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm run audit
